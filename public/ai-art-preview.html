<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V21 Individual AI Portraits</title><style>:root{font-family:system-ui;color:#f1f6ff;background:#080e1b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 2%,#244271,#080e1b 45%)}main{max-width:1280px;margin:auto;padding:26px 18px}h1{font-size:clamp(24px,5vw,42px);color:#ffc56f}a{color:#88caff}p{color:#bcd0df;line-height:1.5}.notice{background:#1c2940;border:1px solid #536b8a;padding:16px;border-radius:12px;margin-bottom:20px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.toolbar input,.toolbar select{background:#111f33;color:white;border:1px solid #7090af;padding:12px;border-radius:9px;font-size:16px;min-height:44px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(42vw,185px),1fr));gap:13px}.card{border:2px solid #ecb45c;border-radius:13px;overflow:hidden;background:#0b1830;box-shadow:0 4px 20px #000b}.card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}.card div{padding:10px}.card strong{display:block;font-size:13px}.card small{font-size:11px;color:#abbed4}.card.fallback{border-color:#6d7c92}.empty{padding:24px;text-align:center}</style></head><body><main><p><a href="index.html">← BACK TO GAME</a></p><h1>INDIVIDUAL AI CHARACTER PORTRAITS</h1><p>Character-specific generated illustrations, with older vector-card artwork for the remaining roster. School scouting changes do not change character rarity in premium packs.</p><div class="notice" id="status">Loading school roster…</div><div class="toolbar"><input id="q" placeholder="Search character / school" aria-label="Search character"><select id="mode"><option value="all">All school players</option><option value="new">Individual AI portraits only</option><option value="fallback">Fallback artwork only</option></select></div><div class="grid" id="gallery"></div></main><script src="roster-data.js"></script><script src="balance.js"></script><script src="ai-portraits/v21-gallery-data.js"></script><script>const q=document.getElementById('q'),mode=document.getElementById('mode'),gallery=document.getElementById('gallery'),status=document.getElementById('status');const list=SPIKE_ROSTER.filter(c=>!c.proOnly),map=V21_AI_URLS;function esc(s){return String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}function paint(){const needle=q.value.toLowerCase(),filtered=list.filter(c=>(c.name+' '+c.school).toLowerCase().includes(needle)&&(mode.value==='all'||(mode.value==='new')===!!map[c.id]));const named=list.filter(x=>!x.supportRoster),done=named.filter(x=>map[x.id]).length;status.innerHTML='<b>'+done+'/'+named.length+' named school-player identities have generated images.</b> Anonymous Itachiyama reserves and remaining players use clearly marked fallbacks. Premium variants may share a character portrait. Images are currently externally hosted.';gallery.innerHTML=filtered.map(c=>{const u=map[c.id];const fallback='portraits/'+String(c.id).padStart(2,'0')+'.svg';return '<article class="card '+(u?'':'fallback')+'"><img loading="lazy" src="'+esc(u||fallback)+'" onerror="this.onerror=null;this.src=''+fallback+''" alt="'+esc(c.name)+' portrait"><div><strong>'+esc(c.name)+'</strong><small>'+esc(c.school)+' · '+c.pos+' · '+SpikeBalance.ratingFor(c,c.id,0)+' OVR · '+(u?'GENERATED':'FALLBACK')+'</small></div></article>'}).join('')||'<p class="empty">No characters match this filter.</p>'}q.addEventListener('input',paint);mode.addEventListener('change',paint);paint();</script></body></html>
