name: Haikyuu Legends V18 Gauntlet, Quests & Multiplayer Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify 57-stage gauntlet, quests, Spring High and online draft rules
        run: npm run test:v18
      - name: Test match engine
        run: npm run test:engine
      - name: Test multiplayer server and room sync
        run: npm test
